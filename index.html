<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b
      );
      color: white;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, transparent 70%);
      filter: blur(80px);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-30px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    .container {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 80px;
      letter-spacing: 4px;
      margin-bottom: 14px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 20px;
    }

    .author {
      margin-top: 30px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <div class="container">
    <h1>Detect</h1>
    <p class="subtitle">Reconstruction in progress.</p>
    <p class="author">by Aurimas B</p>
  </div>

</body>
</html>
